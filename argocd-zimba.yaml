apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zimba2
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io      #cascade delete
spec:
  project: default

  source:
    repoURL: https://github.com/BoobLutos/zimba2.git
    targetRevision: main
    path: k8s             # Argocd watches the k8s folder

  destination:
    server: https://kubernetes.default.svc
    namespace: zimba2

  revisionHistoryLimit: 5

  syncPolicy:
    automated:
      prune: true                      # delete resources removed from k8s/
      selfHeal: true                   # re-sync if cluster drifts from git
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
