apiVersion: apps/v1
kind: Deployment
metadata:
  name: zimba2
  namespace: zimba2
  labels:
    app: zimba2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zimba2
  template:
    metadata:
      labels:
        app: zimba2
    spec:
      containers:
        - name: zimba2
          image: docker.io/booblutos/zimba2:3a67c2833f9372a0877dc21073adb2856b466377
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
