apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zimba2
  namespace: zimba2
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
    - host: zimba2.sinza.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zimba2
                port:
                  number: 80
