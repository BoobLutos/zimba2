name: Build and push image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/booblutos/zimba2:${{ github.sha }}
            docker.io/booblutos/zimba2:latest

      - name: Update deployment image tag
        run: |
          sed -i "s#image: docker.io/booblutos/zimba2:.*#image: docker.io/booblutos/zimba2:${{ github.sha }}#" k8s/deployment.yaml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --quiet --cached || git commit -m "Deploy ${{ github.sha }}"
          git push
